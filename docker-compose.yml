version: "3.8"

services:
    app:
        build:
            context: ./
            dockerfile: Dockerfile
            args:
                user: dimitri
                uid: 1000
        image: shopping-app
        container_name: shopping-app
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - ./:/var/www
            - ./../logs:/var/www/storage/logs
        networks:
            - backend
        command: sh -c "composer install && php-fpm"

    db:
        image: mysql:8.0
        container_name: shopping-db
        restart: unless-stopped
        ports:
            - "3308:3306"
        environment:
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
            MYSQL_PASSWORD: ${DB_PASSWORD}
            MYSQL_USER: ${DB_USERNAME}
        volumes:
            - mysqldb:/var/lib/mysql
        networks:
            - backend

    nginx:
        image: nginx:alpine
        container_name: shopping-nginx
        restart: unless-stopped
        ports:
            - "8080:80"
        volumes:
            - ./:/var/www
            - ./docker-compose/nginx:/etc/nginx/conf.d
        depends_on:
            - app
        networks:
            - backend

    node:
        image: node:20-alpine
        container_name: shopping-node
        working_dir: /var/www
        volumes:
            - ./:/var/www
        ports:
            - "5173:5173"
        command: sh -c "npm install && npm run dev"
        networks:
            - backend

volumes:
    mysqldb:

networks:
    backend:
        driver: bridge
